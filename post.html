<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Post — Sreepriya Radhakrishnan</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
</head>
<body>

<header class="site-header">
  <nav class="nav-pill">
    <a class="brand" href="index.html">Sreepriya Radhakrishnan<span>.</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="work.html">Work</a></li>
      <li><a href="blog.html">Blog</a></li>
      <li><a href="media.html">Media</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
</header>

<main class="wrap">
  <article class="post-body" id="post-body">
    <p>Loading…</p>
  </article>
</main>

<footer class="site-footer">
  <div class="wrap" style="display:flex; justify-content:space-between; width:100%; flex-wrap:wrap; gap:10px;">
    <span>© <span id="year"></span> Sreepriya Radhakrishnan</span>
    <span><a href="blog.html">← Back to blog</a></span>
  </div>
</footer>

<script src="script.js"></script>
<script src="blog.js"></script>
<script>
  document.getElementById("year").textContent = new Date().getFullYear();

  async function renderPost() {
    const params = new URLSearchParams(window.location.search);
    const slug = params.get("slug");
    const container = document.getElementById("post-body");

    if (!slug) {
      container.innerHTML = "<h1>Post not found</h1><p>No post was specified. <a href='blog.html'>Back to blog</a>.</p>";
      return;
    }

    const posts = await loadPosts();
    const post = posts.find((p) => p.slug === slug);

    if (!post) {
      container.innerHTML = "<h1>Post not found</h1><p>That post doesn't exist. <a href='blog.html'>Back to blog</a>.</p>";
      return;
    }

    document.title = `${post.title} — Sreepriya Radhakrishnan`;

    try {
      const raw = await loadPostContent(post.file);
      const html = marked.parse(raw);
      container.innerHTML = `
        <h1>${post.title}</h1>
        <p class="post-meta">${post.date}${post.tags ? " · " + post.tags.join(", ") : ""}</p>
        ${html}
      `;
    } catch (err) {
      container.innerHTML = `<h1>${post.title}</h1><p>Couldn't load this post's content.</p>`;
    }
  }

  renderPost();
</script>

</body>
</html>
